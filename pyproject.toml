[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvin"
version = "0.1.0"
description = "Corvin – Azure-native investigation platform (V1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "elasticsearch>=8.12.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "litellm>=1.30.0",
    "azure-monitor-query>=1.3.0",
    "azure-identity>=1.15.0",
    "kubernetes>=29.0.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
    "pyfiglet>=0.8.0",
    "botbuilder-core>=4.17.0",
    "botbuilder-integration-aiohttp>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
corvin = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "corvin"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
