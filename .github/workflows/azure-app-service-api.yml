name: Azure App Service — Corvin API

# Builds and deploys the FastAPI control plane (Python) to Azure App Service.
#
# Required repo secrets:
#   AZURE_WEBAPP_PUBLISH_PROFILE
#     -> Azure Portal -> App Service -> Overview -> "Get publish profile"
#
# Required repo variable:
#   AZURE_WEBAPP_NAME       -> e.g. corvin-api-akhyb9aaa8hpbxg9
#
# Optional:
#   PYTHON_VERSION          -> defaults to 3.13

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/cli/**'
      - 'apps/teams/**'
      - 'corvin/**'
      - 'config/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'startup.sh'
      - '.github/workflows/azure-app-service-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build, test and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/slices -q --tb=short
        continue-on-error: false

      - name: Create deployment package
        run: |
          # Strip dev-only artifacts; ship only what the App Service runtime needs.
          zip -r release.zip \
            apps corvin config alembic alembic.ini \
            requirements.txt pyproject.toml startup.sh \
            -x '*.pyc' '*__pycache__*' '.venv/*' 'apps/web/*'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
