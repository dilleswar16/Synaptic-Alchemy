name: Azure Static Web Apps — Corvin UI

# Builds and deploys apps/web to Azure Static Web Apps.
#
# Required repo secret:
#   AZURE_STATIC_WEB_APPS_API_TOKEN
#     -> Azure Portal -> Static Web App -> Overview -> "Manage deployment token"
#
# Required repo variable (or set as a build env in SWA):
#   VITE_API_URL  -> https://<your-corvin-api>.azurewebsites.net
#     This must point at the App Service origin (NOT the SWA proxy) so SSE
#     streaming for RCA bypasses the SWA proxy buffer.

on:
  push:
    branches: [main, feature/azure-openai]
    paths:
      - 'apps/web/**'
      - '.github/workflows/azure-static-web-apps.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, feature/azure-openai]
    paths:
      - 'apps/web/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/web'
          api_location: ''
          output_location: 'dist'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
