# Azure DevOps Pipeline — Corvin UI → Azure Static Web Apps
#
# Required pipeline variables (set in ADO → Pipelines → Library):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  (secret)
#     Azure Portal → your Static Web App → Overview → "Manage deployment token"
#   VITE_API_URL  (plain)
#     https://corvin-api-akhyb9aaa8hpbxg9.australiaeast-01.azurewebsites.net

trigger:
  branches:
    include:
      - feature/azure-openai
      - main
  paths:
    include:
      - apps/web/**
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    submodules: false

  - task: NodeTool@0
    displayName: 'Use Node 20'
    inputs:
      versionSpec: '20.x'

  - script: |
      cd apps/web
      npm ci
      npm run build
    displayName: 'npm ci + vite build'
    env:
      VITE_API_URL: $(VITE_API_URL)

  - task: AzureStaticWebApp@0
    displayName: 'Deploy dist/ to Azure SWA'
    inputs:
      app_location: 'apps/web'
      api_location: ''
      output_location: 'dist'
      skip_app_build: true
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
