# LLM provider and model configuration
# Replace these values for your environment.
# API keys and endpoints are bound from environment variables – never hardcode them here.

provider: litellm

# Primary model used for RCA and fix strategy generation.
# Using azure/ prefix for classic Azure OpenAI endpoints
# (https://<resource>.openai.azure.com/).
model: azure/gpt-4.1-mini

# Fallback model when the primary is unavailable or rate-limited.
fallback_model: azure/gpt-4.1-mini

# Controls LLM output determinism (lower = more focused).
temperature: 0.1

# Token ceiling for investigation engine responses.
max_tokens: 4096

# LiteLLM endpoint, API key, and API version are injected via environment variables:
#   LITELLM_ENDPOINT  -> api_base  (e.g. https://synaptic.services.ai.azure.com/api/projects/synaptic-project)
#   LITELLM_API_KEY   -> api_key
#   AZURE_API_VERSION -> api_version (e.g. 2025-01-01-preview)
#   AZURE_AI_FOUNDRY_ENDPOINT -> reserved for future Agents integration
