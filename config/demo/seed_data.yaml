# Demo seed data — loaded by seed_demo.py when CORVIN_DEMO_MODE=true.
#
# Rename or replace this file for your own deployment.
# The seeder is idempotent: it skips rows that already exist.
#
# health_profile controls simulated SLO trajectories:
#   ok       → 99.5–99.9% availability, low burn rate
#   at_risk  → 98–99% availability, elevated burn rate (>0.8)

application:
  name: "Acme Retail"
  description: >
    Acme Retail Platform — checkout API, partner integrations,
    and auth service running in AKS namespace 'acme-retail'.
  team_name: "Acme SRE Team"
  environment_default: "dev"

services:
  # Fields: service_name, display_name, k8s_app_label, namespace, tier, health_profile
  - service_name: checkout-api
    display_name: "Checkout API"
    k8s_app_label: acme-checkout-api
    namespace: acme-retail
    tier: api
    health_profile: ok

  - service_name: auth-service
    display_name: "Auth Service"
    k8s_app_label: acme-auth-service
    namespace: acme-retail
    tier: api
    health_profile: ok

  - service_name: partner-api
    display_name: "Partner API"
    k8s_app_label: acme-partner-api
    namespace: acme-retail
    tier: api
    health_profile: at_risk

