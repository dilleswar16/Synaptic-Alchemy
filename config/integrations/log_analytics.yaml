# Azure Log Analytics integration settings
# Used primarily for APIM gateway evidence queries.
# Credentials are bound from environment variables – never hardcode them here.

# Log Analytics workspace ID.
# Env var: LOG_ANALYTICS_WORKSPACE_ID
workspace_id: "${LOG_ANALYTICS_WORKSPACE_ID}"

# Service principal credentials for azure-monitor-query client.
# Env vars: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
client_id: "${AZURE_CLIENT_ID}"
client_secret: "${AZURE_CLIENT_SECRET}"
tenant_id: "${AZURE_TENANT_ID}"

# Default lookback window for evidence queries (minutes).
default_time_range_minutes: 30
