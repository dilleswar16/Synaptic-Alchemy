# Azure DevOps (Boards) integration settings
# Used to export investigations as work items (incidents/bugs).

# Azure DevOps Organization name (e.g. "my-org" from dev.azure.com/my-org)
# Env var: AZURE_DEVOPS_ORG
org_name: "${AZURE_DEVOPS_ORG}"

# Azure DevOps Project name
# Env var: AZURE_DEVOPS_PROJECT
project_name: "${AZURE_DEVOPS_PROJECT}"

# Personal Access Token (PAT) with "Work Items: Read & Write" scope
# Env var: AZURE_DEVOPS_PAT
pat: "${AZURE_DEVOPS_PAT}"

# Work item type to create — use "Issue" for this project (Agile template, Issue is default)
# Change to "User Story" if you want items on the Stories board instead.
work_item_type: "Issue"

# Area path for created work items — sets which team's board the item appears on.
# Format: "<Project>\\<Team>" — use the exact team name from Azure Boards.
area_path: "Australia IT_AMS\\AUS_Channel_API_Team"

# Fixed tags always added to every Corvin work item (comma-separated).
fixed_tags: "corvin; ChAD"

# Auto-assignment routing based on incident category.
# Category is inferred from RCA root cause keywords.
# Unmatched incidents go to the default_assignee.
assignment_routing:
  code:
    keywords: [exception, error, stacktrace, null, memory, heap, connection pool, database, query, timeout, application, npe, java, spring, hikari, cosmos]
    assignees:
      - dilleswar.dilleswararao@metlife.com
      - yeswanthk.kandlakuti@metlife.com
  devops:
    keywords: [pod, aks, kubernetes, deploy, container, node, cpu, disk, network, otlp, elastic, infra, pipeline, helm, ingress, tls, cert, namespace]
    assignees:
      - chaitanyakumar.pendyala@metlife.com
  default_assignee: priya.kinker@metlife.com

# Set to false to disable ADO delivery without removing the config.
enabled: true

# ── Wiki integration ───────────────────────────────────────────────────────────
# Set wiki_enabled: true to auto-publish RCA pages to an ADO Wiki after each investigation.
# wiki_id: set to "auto" to use the first project wiki, or paste the wiki GUID/slug.
#   Find it at: https://dev.azure.com/{org}/{project}/_apis/wiki/wikis?api-version=7.1
wiki_enabled: true
wiki_id: "auto"
