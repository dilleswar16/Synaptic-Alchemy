# Elastic integration settings
# Replace host, api_key, and index patterns for your environment.
# Credentials are bound from environment variables – never hardcode them here.

# Elastic cluster endpoint.
# Env var: ELASTIC_HOST
host: "${ELASTIC_HOST}"

# Elastic API key for authentication.
# Env var: ELASTIC_API_KEY
api_key: "${ELASTIC_API_KEY}"

# Index patterns for log and metric queries.
log_index_pattern: "logs-*"
metrics_index_pattern: "metrics-*"

# Default lookback window for evidence queries (minutes).
default_time_range_minutes: 30

# Maximum number of log documents to retrieve per query.
max_log_hits: 500
