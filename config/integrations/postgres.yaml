# Postgres persistence settings
# Credentials are bound from environment variables – never hardcode them here.

# Env vars: CORVIN_DB_HOST, CORVIN_DB_NAME, CORVIN_DB_USER, CORVIN_DB_PASSWORD
host: "${CORVIN_DB_HOST}"
port: 5432
database: "${CORVIN_DB_NAME}"
user: "${CORVIN_DB_USER}"
password: "${CORVIN_DB_PASSWORD}"

# SQLAlchemy connection pool settings.
pool_size: 5
max_overflow: 10
pool_timeout_seconds: 30
