# Azure Activity Log integration settings
# Used for change-correlation evidence: "what changed before the alert?"
# Credentials are bound from environment variables – never hardcode them here.

# Azure subscription to query Activity Log events from.
# Env var: AZURE_SUBSCRIPTION_ID
subscription_id: "${AZURE_SUBSCRIPTION_ID}"

# Log Analytics workspace ID that has the AzureActivity table.
# Env var: AZURE_ACTIVITY_WORKSPACE_ID
workspace_id: "${AZURE_ACTIVITY_WORKSPACE_ID}"

# Service principal credentials for azure-monitor-query client.
# Env vars: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
client_id: "${AZURE_CLIENT_ID}"
client_secret: "${AZURE_CLIENT_SECRET}"
tenant_id: "${AZURE_TENANT_ID}"

# How far back to look for changes when no explicit time range is provided (minutes).
default_time_range_minutes: 60

# Maximum number of Activity Log events to retrieve per query.
max_events: 100
