# Container Insights Log Analytics integration settings
# Queries AKS container logs and pod inventory from the CHAD workspace.
# Powered by Azure Monitor Container Insights (omsagent on azaustaekub14470dv0101).

# Log Analytics workspace ID for the CHAD application workspace.
# Env var: CHAD_LOG_ANALYTICS_WORKSPACE_ID
workspace_id: "${CHAD_LOG_ANALYTICS_WORKSPACE_ID}"

# AKS cluster and namespace defaults.
cluster_name: "azaustaekub14470dv0101"
default_namespace: "chad"

# Default lookback window for log queries (minutes).
default_time_range_minutes: 60

# Max log rows returned per query.
max_log_rows: 200
