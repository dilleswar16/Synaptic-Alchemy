# Email delivery settings for RCA report notifications.
# Uses Azure Communication Services Email SDK (no SMTP required).
# Set AZURE_COMMUNICATION_CONNECTION_STRING, CORVIN_EMAIL_FROM, CORVIN_EMAIL_TO in .env

enabled: true

# Sender address — must be a verified domain on your ACS Email resource.
# e.g. DoNotReply@<subdomain>.azurecomm.net
from_address: "${CORVIN_EMAIL_FROM}"

# Recipient(s) — comma-separated list or single address.
to_addresses: "${CORVIN_EMAIL_TO}"

# Automatically send an RCA email after each investigation completes.
# Set to false to disable auto-send (email still available manually via POST /{id}/rca/email).
auto_send_on_rca: true

subject_prefix: "[Corvin RCA]"
