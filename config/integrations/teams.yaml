# Microsoft Teams delivery settings
# Configure an Incoming Webhook connector in the target Teams channel
# and set the URL via the environment variable below.

# Incoming webhook URL.
# Env var: TEAMS_WEBHOOK_URL
webhook_url: "${TEAMS_WEBHOOK_URL}"

# Base URL of the Corvin web app.
# Used to build Approve / Reject button URLs inside Adaptive Cards.
# Env var: CORVIN_WEB_BASE_URL
web_base_url: "${CORVIN_WEB_BASE_URL}"

# Display name used in posted cards.
channel_name: "corvin-alerts"

# Set to false to disable outbound Teams card delivery without removing the config.
enabled: true

# ── V2 ChatOps Bot settings ───────────────────────────────────────────────────
# Bot auth modes supported by the deployed branch:
#   1) User-Assigned Managed Identity (portal configuration you showed)
#   2) Secret-based Azure Bot registration (app_id + app_password)
#
# For UAMI, set TEAMS_APP_ID to the managed identity client ID and leave
# TEAMS_APP_PASSWORD unset/empty. TEAMS_TENANT_ID should still be provided.
# Env vars: TEAMS_APP_ID, TEAMS_APP_PASSWORD, TEAMS_TENANT_ID
bot_enabled: true
app_id: "${TEAMS_APP_ID}"
app_password: "${TEAMS_APP_PASSWORD}"
# Required for Single Tenant bots — set to your Azure AD Tenant ID.
# Find it: Portal → Entra ID → Overview → Tenant ID
# Env var: TEAMS_TENANT_ID
tenant_id: "${TEAMS_TENANT_ID}"
