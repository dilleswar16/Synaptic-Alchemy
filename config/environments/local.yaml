# Local development environment overrides.
# Applied on top of base config files when CORVIN_ENV=local.
# Values here take precedence over config/<concern>.yaml defaults.

postgres:
  host: "${CORVIN_DB_HOST}"
  port: 5432
  database: "${CORVIN_DB_NAME}"
  user: "${CORVIN_DB_USER}"
  password: "${CORVIN_DB_PASSWORD}"

elastic:
  host: "http://localhost:9200"
  api_key: ""

teams:
  enabled: false
