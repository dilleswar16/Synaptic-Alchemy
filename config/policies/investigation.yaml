# Investigation engine policy settings.
# Adjust these to tune investigation behavior without touching core logic.

# Maximum number of evidence items passed to the investigation engine.
max_evidence_items: 500

# Minimum confidence level required before RCA is surfaced to operators.
# Values: high, medium, low
rca_confidence_threshold: medium

# Minimum confidence level for the fix strategy to suggest concrete actions.
# If the RCA confidence is below this, all actions are flagged requires_approval: true
# and a confidence_warning is emitted in the result for the UI to display.
# Values: high, medium, low
min_confidence_to_suggest_action: medium

# Maximum number of fix actions included in a fix strategy output.
fix_strategy_max_actions: 5

# Require at least one evidence source to contain data before generating RCA.
require_evidence_before_rca: true

# V1 only: fix strategies are informational and require human review.
# Do not change to 'auto' in V1.
fix_execution_mode: review_only

# ── V3.5: Blast Radius Estimator ──────────────────────────────────────────────
# Estimated users per healthy pod replica (used when AKS pod count is available).
blast_radius_users_per_replica: 400
# Revenue lost per affected user per minute (in blast_radius_currency).
blast_radius_revenue_per_user_per_min: 0.003
# Currency symbol used in the UI display.
blast_radius_currency: GBP

# ── V3.5: Alert Simulator ──────────────────────────────────────────────────────
# Simulator presets are now DB-driven, managed per-application via the
# Application Panel UI (Applications → Simulator Presets tab).
# Add presets for demo deployments in config/demo/seed_data.yaml.

# ── V3.9: ROI Dashboard ────────────────────────────────────────────────────────
# Baseline MTTR (minutes) before Corvin — used to calculate time saved.
baseline_mttr_minutes: 45
# Loaded engineer cost per hour (salary + oncall premium). Currency is set by roi_currency.
engineer_hourly_rate: 120
# Currency label shown in the UI (ISO 4217 code, e.g. USD, GBP, EUR, AUD).
roi_currency: GBP

# ── V3.9: Voice Briefing (Azure TTS) ─────────────────────────────────────────
# Set to false to disable TTS endpoint even if AZURE_SPEECH_KEY is set.
voice_briefing_enabled: true
# Azure TTS voice name. See: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-support
voice_name: en-GB-RyanNeural

# ── V3.9: War Room ────────────────────────────────────────────────────────────
# Set to true to enable auto-creation of Teams incident channels via Graph API.
war_room_enabled: false
# Minimum alert severity that triggers a war room channel (critical | high | medium)
war_room_min_severity: critical

# ── V3.7: Intelligence Layer ─────────────────────────────────────────────────
predictive_background_enabled: false
predictive_interval_seconds: 300
# Memory pressure threshold for predictive pre-mortem alerts.
predictive_memory_threshold_pct: 85
# Soft fallback baseline (MiB) when memoryLimitBytes telemetry is unavailable.
predictive_memory_soft_limit_mib: 320
# APIM 5xx ratio threshold (%) for error-rate predictive alerts.
predictive_error_rate_threshold_pct: 15
# Error ratio (%) at which error-rate alerts are escalated to critical.
predictive_error_rate_critical_pct: 30
# Absolute 5xx event count threshold in the captured evidence window.
predictive_error_count_threshold: 5
# Total restart count threshold for restart acceleration alerts.
predictive_restart_threshold: 3
# Predictive penalty feedback loop: when enabled, every completed investigation
# that the predictive engine did not forecast records a "penalty" (DB row +
# knowledge/learnings file) which is then injected into future RCA prompts.
# Disabled by default: it fires on nearly every investigation, appends one
# file per incident with no deduplication, and pollutes prompts with noise.
prediction_penalty_enabled: false
sla_target_percent: 99.9
sla_month_minutes: 43200
sla_amber_seconds: 7200
sla_red_seconds: 1800

# ── Alert Suppression / Deduplication ─────────────────────────────────────────
# Minimum minutes before the same service can trigger a new investigation.
# Prevents alert storms from DDoSing the investigation engine.
alert_suppression_window_minutes: 15

# ── Alert Correlation Windows ─────────────────────────────────────────────────
# How close in time two alerts from the same service must be to be correlated.
alert_correlation_same_service_minutes: 5
# How close in time two alerts from adjacent (dependent) services must be.
alert_correlation_adjacent_service_minutes: 10

# ── Toil Tracking ─────────────────────────────────────────────────────────────
# Lookback window for toil/ROI metrics aggregation.
toil_lookback_days: 30

# ── Feature 8: Root Cause Debate Mode ─────────────────────────────────────────
# When enabled, POST /investigations/{id}/hypotheses generates N competing
# root-cause hypotheses from the evidence bundle. The SRE selects the winner
# and the fix strategy is regenerated against the chosen hypothesis.
debate_mode:
  enabled: true
  # Number of competing hypotheses to generate (must be ≥ 2).
  hypothesis_count: 3
  # Minimum number of supporting signals a hypothesis must have to be surfaced.
  # Hypotheses below this threshold are padded with a placeholder signal.
  min_evidence_signals: 2

# ── Feature 9: Incident Heatmap Calendar ──────────────────────────────────────
# Powers GET /investigations/heatmap — a GitHub-contribution-style 90-day view
# of investigation density. Severity colours are mapped to these thresholds.
heatmap:
  severity_thresholds:
    low: 1      # 1 incident/day
    medium: 3   # 3+ incidents/day
    high: 5     # 5+ incidents/day
    critical: 10  # 10+ incidents/day
  default_days: 90
  max_days: 365

# ── Feature 10: Compliance Evidence Pack ──────────────────────────────────────
# Powers GET /investigations/{id}/compliance-pack?format=pdf|zip.
# Generates a tamper-evident audit bundle for SOX/SOC2/ISO27001 auditors.
compliance_pack:
  enabled: true
  # Watermark text printed on PDF and embedded in ZIP manifest.
  watermark_text: "CONFIDENTIAL — FOR AUDIT USE"
  # Whether to include raw evidence JSON files in the ZIP bundle.
  include_raw_evidence: true
  # Compliance frameworks listed in the report header (informational only).
  supported_frameworks:
    - SOX
    - SOC2
    - ISO27001

# ── Feature 7: pgvector Semantic RAG ──────────────────────────────────────────
# Semantic similarity search over past RCA embeddings using pgvector.
# Requires PostgreSQL with the pgvector extension installed.
# When pgvector is unavailable (SQLite or Postgres without extension), the
# system auto-detects this at startup and falls back to keyword search.
# No code change required — just set backend: keyword to force keyword mode.
similarity:
  backend: pgvector        # pgvector | keyword (auto-detected when pgvector unavailable)
  top_k_default: 5         # default number of similar incidents to return
  min_similarity_threshold: 0.72  # minimum cosine similarity score (0.0–1.0)
  index_on_completion: true  # embed + index each investigation when it completes

