# Keigan Helm values. Non-secret settings only; secrets come from Azure Key Vault via the Secrets Store CSI driver.

namespaces:
  frontend: keigan-frontend
  backend: keigan-backend
  create: true

images:
  registry: metlifeacr.azurecr.io
  backend: keigan-backend
  web: keigan-web
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# User-assigned managed identity federated with the backend service account (workload identity).
workloadIdentity:
  clientId: "<managed-identity-client-id>"
  tenantId: "<tenant-id>"

hosts:
  internal: keigan.metlife.example          # corporate users
  public: keigan-hooks.metlife.example      # webhook + bot paths only
ingress:
  className: nginx-internal
  publicClassName: nginx-public
  tlsSecretName: keigan-tls
  # Restrict the public webhook ingress to Azure Monitor (ActionGroup service tag), Elastic Cloud and Bot Framework ranges.
  publicAllowedSourceRanges: []

api:
  # Peers whose X-Forwarded-For / X-Forwarded-Proto headers the API trusts (uvicorn FORWARDED_ALLOW_IPS): comma-separated IPs or CIDRs
  # of the hop directly in front of the pod, i.e. the ingress controller pods (APIM sits in front of the ingress and is not the peer).
  # Replace the placeholder with the ingress controller's pod CIDR or addresses. "*" is refused (any caller could spoof its IP).
  # Left as a placeholder, no peer is trusted: the API still works but sees the ingress address instead of the real client.
  forwardedAllowIps: "<ingress-controller-pod-cidr>"
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCpuUtilizationPercentage: 70 }

worker:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "1", memory: 1536Mi }

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Backend environment (see backend/.env.example for every key).
backendEnvironment:
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  AUTH_MODE: entra
  ENTRA_TENANT_ID: "<tenant-id>"
  ENTRA_API_CLIENT_ID: "<keigan-api-client-id>"
  ENTRA_SPA_CLIENT_ID: "<keigan-spa-client-id>"
  ENTRA_API_SCOPE: "api://<keigan-api-client-id>/access_as_user"
  KEIGAN_ADMIN_GROUP_NAME: KEIGAN_admin
  AZURE_IDENTITY_MODE: workload_identity
  # Shown to application teams on "Grant access". Leave the IDs empty: the workload identity webhook injects
  # AZURE_TENANT_ID and AZURE_CLIENT_ID, and Keigan reads its object ID from its own token. Set them only to override.
  KEIGAN_MANAGED_IDENTITY_OBJECT_ID: ""
  KEIGAN_MANAGED_IDENTITY_CLIENT_ID: ""
  KEIGAN_MANAGED_IDENTITY_DISPLAY_NAME: id-keigan-prod
  TELEMETRY_MODE: live
  SERVICENOW_MODE: live
  SERVICENOW_INSTANCE_URL: "https://metlife.service-now.com"
  TEAMS_MODE: live
  EMAIL_MODE: graph
  GRAPH_SENDER_MAILBOX: keigan@metlife.example
  LLM_PROVIDER: openai_compatible
  LLM_BASE_URL: "https://<internal-ai-gateway>/openai/v1"
  LLM_FAST_MODEL: "<fast-deployment>"
  LLM_DEEP_MODEL: "<deep-deployment>"
  LLM_VISION_MODEL: "<vision-deployment>"
  FILE_STORAGE_MODE: azure_blob
  AZURE_BLOB_ACCOUNT_URL: "https://<storage-account>.blob.core.windows.net"
  SECRET_STORE_MODE: key_vault
  AZURE_KEY_VAULT_URL: "https://<key-vault>.vault.azure.net"
  PUBLIC_BASE_URL: "https://keigan-hooks.metlife.example"
  FRONTEND_BASE_URL: "https://keigan.metlife.example"
  CORS_ALLOWED_ORIGINS: "https://keigan.metlife.example"
  RUN_WORKERS_IN_PROCESS: "false"
  # Tables come from database/azure_sql/*.sql (run once by a DBA) and later releases' Alembic migrations.
  AUTO_CREATE_SCHEMA: "false"
  # Honest outcomes: the confidence a supported hypothesis needs, the most a ruled-out one may have, and the evidence checks one service gets.
  INVESTIGATION_SUPPORTED_MINIMUM_CONFIDENCE: "0.5"
  INVESTIGATION_RULED_OUT_MAXIMUM_CONFIDENCE: "0.2"
  INVESTIGATION_MAX_CHECKS_PER_SERVICE: "7"
  # Characters (1000 to 200000) of one AI call's raw answer kept in an investigation's decision trace; a longer one is cut and marked.
  INVESTIGATION_TRACE_RAW_OUTPUT_STORED_CHARACTERS: "20000"
  # Action items: most the AI may propose per postmortem, latest due date in days, longest details text, shortest reason for blocked or won't do, and the shape of a typed ServiceNow number.
  ACTION_ITEMS_MAXIMUM_PER_POSTMORTEM: "8"
  ACTION_ITEMS_MAXIMUM_DUE_DAYS: "180"
  ACTION_ITEMS_DETAILS_MAXIMUM_CHARACTERS: "4000"
  ACTION_ITEMS_REASON_MINIMUM_CHARACTERS: "10"
  # Action item reminders: master switch, local hour of the daily job, days before the due date, days between overdue reminders, days overdue before escalation, escalation roles, days before closed items are deleted.
  # Error budget policy: one-incident and outage-class thresholds (percent of an SLO's budget), the class window in days, minutes between evaluations, hours until a figure is final, minimum data coverage and events, auto-draft of the postmortem, waiver and guidance lengths, roles told, days breaches are kept.
  # Suggested fixes: longest command shown as copyable.
  SUGGESTED_FIX_MAXIMUM_COMMAND_CHARACTERS: "600"
  # Runbook health: days before a never-used runbook is flagged, days before a runbook is flagged as not updated, fewest rated investigations and the share rated incorrect that flag a runbook.
  RUNBOOK_HEALTH_UNUSED_AFTER_DAYS: "60"
  RUNBOOK_HEALTH_STALE_AFTER_DAYS: "180"
  RUNBOOK_HEALTH_MINIMUM_RATED_INVESTIGATIONS: "3"
  RUNBOOK_HEALTH_WRONG_SHARE_PERCENT: "50.0"
  # Weekly health review: most overdue and unowned action items listed.
  WEEKLY_REVIEW_MAXIMUM_LISTED_ITEMS: "10"
  ERROR_BUDGET_POLICY_SINGLE_INCIDENT_THRESHOLD_PERCENT: "20.0"
  ERROR_BUDGET_POLICY_OUTAGE_CLASS_THRESHOLD_PERCENT: "20.0"
  ERROR_BUDGET_POLICY_OUTAGE_CLASS_WINDOW_DAYS: "90"
  ERROR_BUDGET_POLICY_EVALUATION_INTERVAL_MINUTES: "60"
  ERROR_BUDGET_POLICY_FINAL_AFTER_HOURS: "24"
  ERROR_BUDGET_POLICY_MINIMUM_DATA_COVERAGE_PERCENT: "50.0"
  ERROR_BUDGET_POLICY_MINIMUM_WINDOW_EVENTS: "1000"
  ERROR_BUDGET_POLICY_AUTO_DRAFT_POSTMORTEM: "true"
  ERROR_BUDGET_POLICY_WAIVER_MINIMUM_CHARACTERS: "20"
  ERROR_BUDGET_POLICY_GUIDANCE_MAXIMUM_CHARACTERS: "2000"
  ERROR_BUDGET_POLICY_NOTIFICATION_ROLES: "lead"
  ERROR_BUDGET_POLICY_BREACH_RETENTION_DAYS: "730"
  ACTION_ITEMS_REMINDERS_ENABLED: "true"
  ACTION_ITEMS_REMINDER_HOUR_LOCAL: "9"
  ACTION_ITEMS_REMINDER_DAYS_BEFORE_DUE: "2"
  ACTION_ITEMS_OVERDUE_REMINDER_INTERVAL_DAYS: "7"
  ACTION_ITEMS_ESCALATE_AFTER_OVERDUE_DAYS: "14"
  ACTION_ITEMS_ESCALATION_ROLES: "lead,manager"
  ACTION_ITEMS_CLOSED_RETENTION_DAYS: "730"
  ACTION_ITEMS_EXTERNAL_REFERENCE_PATTERN: '^[A-Z]{2,10}[0-9]{4,12}$'
  # Action items overview: default and longest period in days, look-back of the repeated incidents view, incident priorities that need a final postmortem, and days of grace before one is flagged.
  ACTION_ITEMS_OVERVIEW_DEFAULT_DAYS: "90"
  ACTION_ITEMS_OVERVIEW_MAXIMUM_DAYS: "365"
  ACTION_ITEMS_REPEAT_WINDOW_DAYS: "90"
  ACTION_ITEMS_POSTMORTEM_REQUIRED_PRIORITIES: "P1,P2"
  ACTION_ITEMS_POSTMORTEM_GRACE_DAYS: "3"
  # Azure SQL: tables live in the "keigan" schema; Keigan signs in to SQL with its managed identity (no password).
  # DATABASE_URL (Key Vault) then holds no secret, e.g.
  # mssql+aioodbc://@<server>.database.windows.net:1433/<database>?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=no
  DATABASE_SCHEMA: keigan
  DATABASE_AUTHENTICATION: managed_identity
  # Ask Keigan (the chat that calls Keigan's read-only tools and shows each call). An answer is bounded by its tool-call limit and token budget, not by time.
  # Tool calls one answer may make in the Keigan AI chat page (1 to 50); raise it when answers need more lookups.
  ASK_KEIGAN_MAX_TOOL_CALLS_GLOBAL: "8"
  # Tool calls one answer may make in an investigation's chat panel (1 to 50).
  ASK_KEIGAN_MAX_TOOL_CALLS_INVESTIGATION: "6"
  # Tool requests run from one model turn (1 to 5); the rest are recorded as skipped.
  ASK_KEIGAN_MAX_PARALLEL_TOOL_CALLS: "3"
  # Seconds one tool call may take (5 to 600); stops a hung call, never a long answer.
  ASK_KEIGAN_TOOL_TIMEOUT_SECONDS: "60"
  # Input plus output tokens across all model turns of one answer (5000 to 1000000); at 85 % the next turn is the last.
  ASK_KEIGAN_ANSWER_TOKEN_BUDGET: "80000"
  # Characters of one tool result sent to the model (500 to 50000); not larger than the stored size.
  ASK_KEIGAN_TOOL_OUTPUT_MODEL_CHARACTERS: "6000"
  # Longest Mermaid diagram (500 to 20000 characters) an answer may carry; a longer one is shown as code, not drawn.
  ASK_KEIGAN_DIAGRAM_MAXIMUM_CHARACTERS: "6000"
  # Most lines (10 to 500) of one Mermaid diagram; more is shown as code, not drawn.
  ASK_KEIGAN_DIAGRAM_MAXIMUM_LINES: "120"
  # Characters of one tool result kept as its full output (1000 to 1000000).
  ASK_KEIGAN_TOOL_OUTPUT_STORED_CHARACTERS: "60000"
  # Characters of one tool result sent live to the browser (200 to 10000); not larger than the stored size.
  ASK_KEIGAN_TOOL_OUTPUT_PREVIEW_CHARACTERS: "1500"
  # Items a list tool returns (1 to 200).
  ASK_KEIGAN_TOOL_LIST_ITEM_LIMIT: "20"
  # Points a series tool returns (10 to 1000); the bucket width of a series grows to keep them within it.
  ASK_KEIGAN_TOOL_SERIES_POINT_LIMIT: "100"
  # Characters of one passage a tool returns, such as a runbook's steps (200 to 20000); longer text is cut.
  ASK_KEIGAN_TOOL_PASSAGE_CHARACTERS: "2400"
  # Longest window, in minutes, a log query tool call may look back (5 to 43200).
  ASK_KEIGAN_LOG_QUERY_MAX_LOOKBACK_MINUTES: "43200"
  # Token budget of the knowledge passages one search_knowledge call returns (500 to 20000).
  ASK_KEIGAN_KNOWLEDGE_TOKEN_BUDGET: "2500"
  # Newest timeline events in the investigation digest the model starts from (0 to 100).
  ASK_KEIGAN_DIGEST_TIMELINE_EVENTS: "15"
  # Topology node names in the investigation digest (0 to 500).
  ASK_KEIGAN_DIGEST_TOPOLOGY_NODES: "40"
  # Characters of one evidence summary in the investigation digest (50 to 2000).
  ASK_KEIGAN_DIGEST_EVIDENCE_SUMMARY_CHARACTERS: "300"
  # Follow-up question chips shown under an answer (0 to 5).
  ASK_KEIGAN_FOLLOW_UP_QUESTION_LIMIT: "3"
  # Repair retries per model turn (0 to 2) for models that use the JSON tool protocol instead of native tool calling.
  ASK_KEIGAN_PROTOCOL_REPAIR_ATTEMPTS: "1"
  # Seconds without progress (60 to 3600) after which a running answer counts as interrupted, for example after a pod restart.
  ASK_KEIGAN_STALE_RUN_SECONDS: "300"
  # How often a live answer records its progress (5 to 300 s); the stale-run limit must be at least 3 times this.
  ASK_KEIGAN_PROGRESS_HEARTBEAT_SECONDS: "15"
  # Seconds between keep-alive comments on the answer stream (5 to 60), for proxies with an idle limit.
  ASK_KEIGAN_HEARTBEAT_SECONDS: "15"
  # Events one answer may queue for a slow reader (100 to 100000); when full, the browser reads the stored trace instead.
  ASK_KEIGAN_EVENT_QUEUE_SIZE: "1000"
  # Seconds (1 to 120) a stopping API process waits for running answers to end before marking them interrupted.
  ASK_KEIGAN_SHUTDOWN_GRACE_SECONDS: "10"
  # Optional: days (30 to 3650) after which stored steps and runs are purged, the answers stay; empty keeps everything.
  ASK_KEIGAN_TRACE_RETENTION_DAYS: ""
  # Where the conformance script writes its report and the administration page reads the last one (a file path, relative to the working directory).
  ASK_KEIGAN_CONFORMANCE_REPORT_PATH: "ask_keigan_conformance_report.json"
  # Optional JSON overrides of what each model can do (tool calling, streaming, context size); shape in resources/catalogs/llm_model_capabilities.yaml.
  LLM_MODEL_CAPABILITIES_JSON: "{}"

# Database migration job (Helm pre-install/pre-upgrade hook running "alembic upgrade head").
# Its identity needs ALTER/CREATE TABLE rights (optional grants in database/azure_sql/06_grant_keigan_identity.sql).
# Set enabled: false if DBAs apply schema changes with the generated SQL scripts instead.
databaseMigration:
  enabled: true

# Key Vault secrets exposed as environment variables (Secrets Store CSI driver).
keyVault:
  enabled: true
  name: "<key-vault>"
  secrets:
    - objectName: keigan-database-url
      environmentVariable: DATABASE_URL
    - objectName: keigan-llm-api-key
      environmentVariable: LLM_API_KEY
    # Outside ENVIRONMENT=local/test the backend refuses to start with the built-in default signing secret, even in entra mode
    # where local sign-in tokens are never issued. Store any random value of at least 32 characters (for example 48 random bytes, base64).
    - objectName: keigan-local-token-signing-secret
      environmentVariable: LOCAL_TOKEN_SIGNING_SECRET

# Egress NetworkPolicy for the API and worker pods (templates/egress-network-policy.yaml).
# Once a pod is selected by an egress policy, ALL outbound traffic not listed here is dropped. That limits what a server-side request
# forgery (user-configured integration URLs, log tool hosts, synthetic probes) can reach: cluster services, the node metadata
# endpoint and private networks stay blocked unless listed below.
# A NetworkPolicy matches addresses, not host names: list the private endpoint or firewall ranges (CIDRs) of each destination.
# A destination with no CIDRs produces no rule (stays blocked). Ask the network team for the ranges; they change rarely.
egress:
  enabled: true
  dns:
    # The cluster DNS pods (CoreDNS on AKS). Port 53 over UDP and TCP.
    namespace: kube-system
    podLabelKey: k8s-app
    podLabelValue: kube-dns
  destinations:
    azureSql:
      cidrs: []        # e.g. the private endpoint subnet of the Azure SQL server
      ports: [1433]
    keyVault:
      cidrs: []        # private endpoint of the Key Vault
      ports: [443]
    microsoftIdentityAndGraph:
      cidrs: []        # login.microsoftonline.com and graph.microsoft.com (Entra sign-in keys, workload identity token, groups, mail)
      ports: [443]
    azureMonitor:
      cidrs: []        # Log Analytics / Azure Data Explorer query endpoints and Application Insights
      ports: [443]
    llmGateway:
      cidrs: []        # the corporate AI gateway behind LLM_BASE_URL
      ports: [443]
    botFramework:
      cidrs: []        # smba.trafficmanager.net / *.botframework.com (proactive Teams messages)
      ports: [443]
    serviceNow:
      cidrs: []        # the ServiceNow instance
      ports: [443]
  # One entry per log tool Keigan queries (Elastic, Splunk, Datadog ...). Each entry: name, cidrs, ports.
  # logTools:
  #   - { name: elastic-prod, cidrs: ["10.20.30.0/24"], ports: [9243] }
  logTools: []
  # Anything else (for example an SMTP relay): same shape as logTools.
  additional: []
