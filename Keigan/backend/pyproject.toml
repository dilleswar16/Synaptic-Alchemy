[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keigan"
version = "0.1.0"
description = "Keigan (慧眼) — AI SRE platform: incident root cause analysis, alert noise reduction, SLO monitoring and predictive intelligence."
requires-python = ">=3.12"
# Version ranges only. The Docker image installs the pinned, hashed requirements.lock: regenerate it after changing this list
# (the command is at the top of requirements.lock).
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    "pypdf>=4.2",
    "azure-identity>=1.17",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
# Azure SQL / SQL Server (DATABASE_URL=mssql+aioodbc://...); also needs the Microsoft ODBC Driver 18 on the host.
azuresql = ["aioodbc>=0.5"]
# Test suite: pip install -e ".[dev]" then python -m pytest
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --import-mode=importlib"

[tool.setuptools.packages.find]
include = ["keigan*"]

[tool.setuptools.package-data]
keigan = ["resources/**/*"]
