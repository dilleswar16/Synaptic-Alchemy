# Alembic migrations for Keigan. The database URL comes from keigan.config.settings (DATABASE_URL), never from this file.
# Usage (from backend/):
#   .\.venv\Scripts\python.exe -m alembic upgrade head                       # apply migrations
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "add …"  # after changing entities
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
