# Advisory prompt-injection indicators (see keigan/ai/prompt_safety.py).
# The detector only raises a warning flag; it never blocks content and is not a security boundary.
# The text is normalised first (NFKC, invisible characters removed, lower-cased, look-alike letters mapped to Latin),
# and a second copy with single-letter spacing removed ("i g n o r e") is checked as well.
# weight: 0..1. A text is suspicious from 0.5; every extra matching indicator adds 0.1.

# Cyrillic and Greek letters that look like Latin letters (NFKC does not fold them).
homoglyphs:
  "а": "a"
  "е": "e"
  "о": "o"
  "р": "p"
  "с": "c"
  "у": "y"
  "х": "x"
  "і": "i"
  "ј": "j"
  "ѕ": "s"
  "һ": "h"
  "ԁ": "d"
  "ɡ": "g"
  "ο": "o"
  "α": "a"
  "ε": "e"
  "ι": "i"
  "ν": "v"
  "ρ": "p"
  "τ": "t"
  "υ": "u"
  "κ": "k"

indicators:
  - name: ignore_instructions
    weight: 0.9
    pattern: '\b(ignore|disregard|forget|override|bypass|discard)\b.{0,40}\b(previous|prior|above|earlier|preceding|all|any|your|the)\b.{0,30}\b(instructions?|rules?|prompts?|guidance|guidelines?|directions?|policy|policies|context|constraints?)'
  - name: new_role
    weight: 0.6
    pattern: '\byou are (now|no longer)\b|\bact as\b.{0,30}\b(admin|system|developer|assistant)\b'
  - name: system_prompt_probe
    weight: 0.6
    pattern: '\b(system|hidden|initial)\s+(prompt|message|instructions?)\b'
  - name: reveal_request
    weight: 0.7
    pattern: '\b(reveal|print|show|output|leak)\b.{0,40}\b(prompt|instructions?|secrets?|keys?|tokens?|passwords?)\b'
  - name: fake_delimiter
    weight: 0.8
    pattern: '</?\s*(untrusted_data|system|assistant|instructions?)\b'
  - name: role_prefix
    weight: 0.4
    pattern: '(?m)^\s*(system|assistant|developer|administrator|admin)\s*[:：]'
  - name: new_policy
    weight: 0.5
    pattern: '\b(new|updated|revised)\s+(policy|instructions?|rules?|directives?|orders?)\b'
  - name: tool_call_injection
    weight: 0.5
    pattern: '"(tool|function)_?(call|name)"\s*:'
  - name: exfiltration
    weight: 0.5
    pattern: '\b(send|email|post|upload|exfiltrate)\b.{0,40}\b(to|at)\b.{0,40}(https?://|@)'
  - name: japanese_ignore
    weight: 0.9
    pattern: '(指示|命令|ルール|プロンプト)[をはも]?\s*(無視|忘れ|破棄|従わな)'
  - name: japanese_system_prompt
    weight: 0.6
    pattern: 'システム\s*(プロンプト|メッセージ)'
